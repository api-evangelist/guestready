apis:
- name: RentalReady API
  description: >-
    REST API for the RentalReady property management system built by GuestReady Group. 252 operations
    across 60 resource groups — rentals and property layout, reservations and quotes, calendar and daily
    prices, rate rules and pricing algorithms, missions and agents, issues and incidents, conversations,
    messages and inquiries, reviews, owners and property managers, listings and rental platform accounts,
    iCal calendar sync, guest registration, city tax rules, payment links, payout adjustments, payment
    acceptance transactions and accounting invoices. OAuth 2.0 authorization-code flow with per-resource
    read/write scopes; also accepts a Token header and HTTP basic. Documented throttle of 400 requests
    per minute.
  humanURL: https://pms.rentalready.io/api/v3/schema/swagger-ui/
  baseURL: https://pms.rentalready.io/api/v3/
