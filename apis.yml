aid: guestready
name: GuestReady
description: >-
  GuestReady is a full-service short-term and mid-term rental hospitality management company operating
  across Europe and the Middle East (United Kingdom, France, Portugal, Spain, Switzerland and the UAE),
  managing Airbnb, Booking.com, Vrbo and direct-booking properties on behalf of owners and investors —
  listing optimisation, dynamic pricing, guest communication, cleaning, maintenance and on-the-ground
  operations. GuestReady Group is also the author of RentalReady, the property management system (PMS)
  it originally built for its own operations and now sells to external property managers. RentalReady
  is the group's developer-facing surface: a 252-operation OpenAPI 3.0.3 REST API at
  pms.rentalready.io/api/v3/ covering rentals, reservations, calendar, pricing, missions, issues,
  conversations, reviews, owners, invoicing and payments, secured with OAuth 2.0 authorization-code
  flow and 50+ granular scopes, plus a Model Context Protocol (MCP) server that connects AI agents to
  live PMS data.
