domain_standards:
- id: icalendar
  name: iCalendar (RFC 5545) availability exchange
  market: short-term / vacation rental distribution
  conforms: true
  evidence: >-
    The contract declares a first-class iCal synchronisation resource, not a prose claim: components.schemas.IcalSync
    with an `ical_url` property (format: uri, title "ICal Import URL", description "The URL to fetch the iCal
    calendar from"), `platform_id`, `is_active` and `last_sync`, exposed as a full CRUD surface at
    /api/v3/icals/ (icals_list, icals_create, icals_retrieve, icals_update, icals_partial_update, icals_destroy)
    and paginated as components.schemas.PaginatedIcalSyncList.
  why_it_matters: >-
    iCal URL exchange is the lowest-common-denominator interoperability standard between short-term rental
    platforms, channel managers and PMSs. A property manager whose other systems already speak iCal connects a
    calendar to RentalReady with a URL and no bespoke connector; one whose systems do not needs a bilateral
    integration. The distinction is a real integration-cost difference for a buyer.
  spec_location: 'components.schemas.IcalSync ; paths./api/v3/icals/'
  docs: https://support.rentalready.com/hc/en-us/articles/41553167842961-iCal-Calendar-Synchronization
- id: ota-channel-distribution
  name: OTA channel distribution (Airbnb / Booking.com / Vrbo native APIs)
  market: short-term / vacation rental distribution
  conforms: partial
  evidence: >-
    /api/v3/listings/, /api/v3/rental_platform_accounts/, /api/v3/rental_platform_settings/ and
    /api/v3/reservation_platforms/ model per-OTA accounts, listings and overrides
    (components.schemas.RentalListing, RentalAccount, SynchronizationCategoryEnum, ChannelEnum).
  note: >-
    Recorded as `partial` deliberately: these are integrations against each OTA's proprietary API, not an
    implementation of an open distribution standard. No OpenTravel (OTA/OTC), HTNG or ALP schema, namespace or
    message type appears anywhere in the contract. This is an honest "the market standard is not what this
    provider implements", not a conformance claim.
- id: none-applicable
  name: SCIM / OData / OpenRTB / HL7 / X12 / ISO 20022 / ActivityPub / OAI-PMH / LTI
