    CreateMultiUnit:
      type: object
      description: |-
        Create a parent/child multi-unit from a main unit and its sub-units.

        The multi-unit takes its office and address from the main unit and is created
        ACTIVE. Assigning the properties blocks the calendars of their future
        reservations (see ``save_rentals_and_block``).
      properties:
        name:
          type: string
          description: Name of the multi-unit.
        host:
          type: string
          description: Username of the owner the multi-unit belongs to.
        main_unit:
          type: string
          title: Contract number
          description: Id of the property (rental) to use as the main (parent) unit.
            Its office and address become the multi-unit's office and address.
        rentals:
          type: array
          items:
            type: string
            title: Contract number
          description: Ids of the properties (rentals) to group under the multi-unit,
            including the main unit and at least one sub-unit. The main unit is added
            automatically if omitted. Each property must not already belong to another
            multi-unit and must share the main unit's address or sit within the configured
            distance of it. Once assigned, each property's future reservations have
            their calendars blocked.
      required:
      - host
      - main_unit
      - name
      - rentals
