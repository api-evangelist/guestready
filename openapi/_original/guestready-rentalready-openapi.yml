components:
  schemas:
    AccountingInvoiceCreate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        external_id:
          type: string
          maxLength: 200
        pdf:
          type: string
          format: uri
        type:
          $ref: '#/components/schemas/AccountingInvoiceCreateTypeEnum'
        category:
          $ref: '#/components/schemas/AccountingInvoiceCreateCategoryEnum'
        original_invoice:
          type: integer
          nullable: true
        serie:
          type: string
          nullable: true
          maxLength: 100
        emmission_date:
          type: string
          format: date
          nullable: true
        description:
          type: string
          nullable: true
          maxLength: 200
        total_net:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
          nullable: true
          description: Price without VAT
        total_gross:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
          nullable: true
          description: Price with VAT
        total_vat:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
          nullable: true
        currency:
          $ref: '#/components/schemas/CurrencyD53Enum'
        reservation:
          type: integer
          nullable: true
        payout_adjustment:
          type: integer
          nullable: true
        payment_link:
          type: integer
          nullable: true
        source_id:
          type: integer
          writeOnly: true
      required:
      - category
      - external_id
      - id
      - pdf
      - source_id
      - type
    AccountingInvoiceCreateCategoryEnum:
      enum:
      - COMMISSION
      - STAY
      - SINGLE_DOCUMENT
      - CLEANING
      - COMMISSION_AND_PAYMENT_FEE
      - PLATFORM_FEE
      - PMS
      - ADJUSTMENT
      - PAYMENT_LINK
      - RESOLUTION
      - EXTRA_FEE
      - GUEST_INVOICE
      type: string
      description: |-
        * `COMMISSION` - Commission
        * `STAY` - Stay
        * `SINGLE_DOCUMENT` - Single document
        * `CLEANING` - Cleaning
        * `COMMISSION_AND_PAYMENT_FEE` - Commission and payment fee
        * `PLATFORM_FEE` - Platform fee
        * `PMS` - Property management software invoice
        * `ADJUSTMENT` - Payout adjustment
        * `PAYMENT_LINK` - Payment link
        * `RESOLUTION` - Resolution
        * `EXTRA_FEE` - Extra fee
        * `GUEST_INVOICE` - Guest invoice
    AccountingInvoiceCreateTypeEnum:
      enum:
      - INVOICE
      - STATEMENT
      - CREDIT_NOTE
      - RECEIPT
      type: string
      description: |-
        * `INVOICE` - Invoice
        * `STATEMENT` - Statement
        * `CREDIT_NOTE` - Credit Note
        * `RECEIPT` - Receipt
    ActiveStatusEnum:
      enum:
      - PENDING
      - DOING
      - DONE
      type: string
      description: |-
        * `PENDING` - PENDING
        * `DOING` - DOING
        * `DONE` - DONE
    Agent:
      type: object
      description: |-
        Read-only lookup: who the caller may put on a mission, and their id.

        An allowlist, not the model: no phone, address, date of birth or identity
        document. ``antennes`` renders whatever ``AgentsViewSet`` prefetched, which is
        where its scoping lives.
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AgentStatusEnum'
          description: |-
            Whether the agent is still working: ACTIVE or INACTIVE. Assigning a mission does NOT check this, so an INACTIVE agent must be filtered out here rather than relied on to be refused.

            * `ACTIVE` - Active
            * `INACTIVE` - Inactive
        antennes:
          type: array
          items:
            type: integer
            title: Offices
          title: Offices
          description: Ids of the offices the agent works for, restricted to the offices
            you have access to. A mission can only be assigned to an agent of the
            mission's own office.
        type_mission:
          type: array
          items:
            type: integer
            title: Mission types
          title: Mission types
          description: Ids of the mission types the agent is qualified for (list them
            with the type_missions resource). A mission can only be assigned to an
            agent qualified for its type.
      required:
      - antennes
      - first_name
      - id
      - last_name
    AgentStatusEnum:
      enum:
      - ACTIVE
      - INACTIVE
      type: string
      description: |-
        * `ACTIVE` - Active
        * `INACTIVE` - Inactive
    AmenityMetadata:
      type: object
      properties:
        key:
          type: string
          description: Stable identifier for this metadata field.
          maxLength: 100
        type:
          type: string
          description: 'Value type. One of: integer, boolean, choice, choices, time,
            amenity_price, schedule, month_ranges.'
          maxLength: 100
        options:
          type: string
          readOnly: true
          description: Allowed values for choice/choices types. Empty for other types.
            UNKNOWN_* sentinels are excluded.
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          description: Display order within the amenity's metadata fields.
      required:
      - key
      - options
      - type
    BankAccountCurrencyEnum:
      enum:
      - EUR
      - GBP
      - USD
      - AED
      - SAR
      - INR
      - QAR
