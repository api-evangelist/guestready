    Inquiry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/InquiryStatusEnum'
          readOnly: true
          description: |-
            Inquiry state. Currently produced: inquiry (guest info request, no booking), pending (reservation request awaiting host accept/decline), preapproved (host pre-approved; not yet a confirmed booking), denied (host declined), cancelled (request voided/withdrawn). Legacy / not currently emitted: accepted, not_possible, special_offer, not_found. A confirmed booking is read from the conversation's reservation_ids, not from an inquiry status.

            * `inquiry` - Inquiry
            * `pending` - Pending
            * `preapproved` - Pre-approved
            * `denied` - Refused
            * `not_possible` - Not possible
            * `accepted` - Accepted
            * `cancelled` - Cancelled
            * `special_offer` - Special offer
            * `not_found` - Not found
        checkin_date:
          type: string
          format: date
          readOnly: true
          nullable: true
          description: Requested check-in date for the prospective stay (YYYY-MM-DD).
        checkout_date:
          type: string
          format: date
          readOnly: true
          nullable: true
          description: Requested check-out date for the prospective stay (YYYY-MM-DD).
        origin:
          allOf:
          - $ref: '#/components/schemas/InquiryOriginEnum'
          readOnly: true
          description: |-
            Source the inquiry came from, i.e. the platform or channel that originated it (e.g. Airbnb, Booking.com, direct email).

            * `channel_manager` - Platform
            * `bookingsync_inbox` - BookingSync
            * `airbnb_message` - Airbnb
            * `airbnb_email` - Airbnb
            * `airbnb_tentative` - Airbnb
            * `booking-com` - Booking.com
            * `homeaway` - HomeAway
            * `homeaway_tentative` - HomeAway
            * `tripadvisor` - TripAdvisor
            * `email` - Email
            * `messenger` - Messenger
            * `whatsapp` - WhatsApp
            * `sms` - SMS
            * `notification` - Email
            * `event` - Email
            * `airbnb_review` - Airbnb
            * `guestspace` - Guest space
            * `twilio` - SMS
            * `booking_widget` - Direct booking widget
            * `support` - Support
        rental_id:
          type: string
          readOnly: true
          description: Id of the property (rental) the inquiry is about.
      required:
      - checkin_date
      - checkout_date
      - id
      - origin
      - rental_id
      - status
