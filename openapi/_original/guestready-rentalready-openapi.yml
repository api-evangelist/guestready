  /api/v3/blacklist/:
    get:
      operationId: blacklist_list
      parameters:
      - in: query
        name: antenne
        schema:
          type: array
          items:
            type: integer
        description: Office
        explode: true
        style: form
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
      - in: query
        name: emails
        schema:
          type: string
      - in: query
        name: first_name
        schema:
          type: string
      - in: query
        name: last_name
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: modified_after
        schema:
          type: string
          format: date-time
      - in: query
        name: modified_before
        schema:
          type: string
          format: date-time
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: phones
        schema:
          type: string
      - in: query
        name: reservations
        schema:
          type: array
          items:
            type: integer
        description: Reservation
        explode: true
        style: form
      - in: query
        name: reservations__appartement__antenne__property_manager
        schema:
          type: array
          items:
            type: integer
        description: Property manager
        explode: true
        style: form
      - in: query
        name: reservations__reservation_platform
        schema:
          type: array
          items:
            type: integer
        description: Platform
        explode: true
        style: form
      tags:
      - blacklist
      security:
      - oauth2:
        - blacklist:read
      responses:
