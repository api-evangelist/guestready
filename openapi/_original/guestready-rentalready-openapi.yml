    IssueNote:
      type: object
      description: |-
        A note on a ticket: the internal, append-only activity log of the ticket.

        The author is server-controlled -- the viewset sets it from the authenticated
        caller -- so a client cannot attribute a note to somebody else. ``issue`` IS
        writable here (unlike the ticket-nested shape this replaced, where it came
        from the URL), and its write queryset is scoped to the caller's own tickets,
        same as every writable relation on ``IssueSerializer``.
