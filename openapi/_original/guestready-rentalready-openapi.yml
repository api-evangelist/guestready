    IsAvailableEnum:
      enum:
      - AVAILABLE
      - BOOKED
      - UNAVAILABLE
      type: string
      description: |-
        * `AVAILABLE` - AVAILABLE
        * `BOOKED` - BOOKED
        * `UNAVAILABLE` - UNAVAILABLE
    Issue:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        host:
          type: integer
          nullable: true
          title: Owner
          description: Id of the property owner the ticket is about.
        rental:
          type: string
          title: Property
          description: Id of the property (rental) the ticket is about. At least one
            of rental, host, issue_mission, mission_incident, reservation, or guest_review
            is required.
          nullable: true
        issue_mission:
          type: integer
          nullable: true
          title: Mission
          description: Id of the mission the ticket relates to, if any.
        mission_incident:
          type: integer
          nullable: true
          description: 'Id of the mission incident the ticket is raised from — a problem
            a field agent reported during a mission. This is NOT issue_mission, which
            takes a mission id. When set, the incident''s photo and attachments are
            copied onto the ticket, and a new incident is marked as having a ticket.
            An archived or closed incident keeps its status: linking a ticket never
            reopens it.'
        reservation:
          type: integer
          nullable: true
          description: Id of the reservation (booking) concerned, if any.
        guest_review:
          type: integer
          nullable: true
          description: Id of the guest review the ticket relates to, if any.
        assignees:
          type: array
          items:
            type: integer
          description: Ids of the users to assign the ticket to.
        group_assignees:
          type: array
          items:
            type: integer
          description: Ids of the support-user groups to assign the ticket to.
        status:
          allOf:
          - $ref: '#/components/schemas/IssueStatusEnum'
          description: |-
            Workflow state of the ticket; defaults to OPEN. FINANCIAL_REVIEW means the ticket is under financial review.

            * `OPEN` - Open
            * `ONGOING_RESOLUTION` - Ongoing resolution
            * `CLOSED` - Closed
            * `ON_HOLD` - On hold
            * `FINANCIAL_REVIEW` - Under financial review
        priority_level:
          allOf:
          - $ref: '#/components/schemas/PriorityLevelEnum'
          description: |-
            Urgency of the ticket, from LV1_EMERGENCY (most urgent) to LV4_LOW (least urgent). Defaults to LV4_LOW.

            * `LV1_EMERGENCY` - Urgent
            * `LV2_HIGH` - High
            * `LV3_MEDIUM` - Mid
            * `LV4_LOW` - Low
        category:
          type: integer
          description: Id of the ticket category. Must be a child category (one that
            itself has a parent category).
        due_date:
          type: string
          format: date
          nullable: true
          description: Date the ticket is due (YYYY-MM-DD).
        intervention_allowed:
          type: boolean
          title: Guest allowed intervention during their stay
          description: Whether the guest permits intervention at the property during
            their stay. Defaults to false.
        title:
          type: string
          nullable: true
          description: Short title of the ticket, shown as its headline in ticket
            lists. Optional, up to 100 characters; the description goes in creation_comment.
          maxLength: 100
        creation_comment:
          type: string
          nullable: true
          title: Description
          description: Opening comment describing the problem, shown on the ticket.
        origin:
          allOf:
          - $ref: '#/components/schemas/IssueOriginEnum'
          description: |-
            How the ticket was reported, i.e. where it originated. Defaults to UNKNOWN.

            * `GUEST_DAMAGES` - Guest damages
            * `GUEST_REPORTED` - Reported by guest
            * `HOST_REPORTED` - Reported by owner
            * `AGENT_REPORTED` - Reported by agent
            * `PROPERTY_CHECK` - Property check
            * `OVERUSE` - Overuse
            * `UNKNOWN` - Unknown
            * `CLEANING_TEAM_REPORTED` - Reported by cleaning team
            * `REVIEW` - Guest review
            * `INBOX_THREAD_CREATED` - Created from inbox thread
            * `MISSION_INCIDENT_REPORTED` - Reported by agent through mission incident
            * `COURTESY_CALL` - Courtesy call
        parent_issue:
          type: integer
          nullable: true
          title: Parent ticket
          description: Id of the parent ticket, when creating a sub-ticket.
        keep_ticket_after_rental_offboarding:
          type: boolean
          title: Ticket should stay open after property offboarding
          description: When true, the ticket stays open after its property is offboarded
            instead of being closed automatically. Defaults to false.
        user:
          type: string
          readOnly: true
      required:
      - category
      - id
      - user
    IssueCategory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Name of the ticket category.
          maxLength: 100
        parent:
          type: integer
          nullable: true
          description: Id of the parent category, or null when this is a top-level
            category.
        full_name:
          type: string
          nullable: true
          description: Full hierarchical name of the category, combining any parent
            categories with its own name (for example 'Plumbing > Leak').
          maxLength: 300
        user:
          type: string
          readOnly: true
      required:
      - id
      - name
      - user
