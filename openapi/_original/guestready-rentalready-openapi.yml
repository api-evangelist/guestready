          maxLength: 100
        label:
          type: string
          maxLength: 255
        field_type:
          $ref: '#/components/schemas/FieldTypeEnum'
        options:
          type: array
          items:
            type: string
            maxLength: 255
          description: List of allowed values. Required for 'select' field type, must
            be omitted or empty for other types.
        created:
