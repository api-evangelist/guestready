      description: Archive a mission incident, optionally recording why. Archiving
        never records a closing user. Only a non-empty comment overwrites the existing
        status comment. Archived is terminal, so an already archived incident cannot
        be archived again (400).
      summary: Archive Incident
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this mission incident.
        required: true
      tags:
