    PatchedUpdateMissionEndTime:
      type: object
      description: |-
        Base for the update_start_time / update_end_time actions.

        Subclasses declare their own datetime field and move it onto the mission in
        ``_apply_new_time``; the audit comment and the write are shared. Both pin
        ``default_timezone`` to UTC so the parsed value carries a fixed offset:
        ``_apply_new_time`` adds the mission duration to it, and adding to a
        zone-aware datetime shifts the wall clock without renormalising, so a
        dynamic zone would drift across a DST transition.
      properties:
        edit_comment:
          type: string
          description: Reason for the change, recorded on the mission.
        end:
          type: string
          format: date-time
          description: New mission end date and time. The UTC offset is required,
            e.g. 2026-07-04T11:00:00+00:00 or 2026-07-04T13:00:00+02:00.
    PatchedUpdateMissionStartTime:
      type: object
      description: |-
        Base for the update_start_time / update_end_time actions.

        Subclasses declare their own datetime field and move it onto the mission in
        ``_apply_new_time``; the audit comment and the write are shared. Both pin
        ``default_timezone`` to UTC so the parsed value carries a fixed offset:
        ``_apply_new_time`` adds the mission duration to it, and adding to a
        zone-aware datetime shifts the wall clock without renormalising, so a
        dynamic zone would drift across a DST transition.
      properties:
        edit_comment:
          type: string
          description: Reason for the change, recorded on the mission.
        start:
          type: string
          format: date-time
          description: New mission start date and time. The UTC offset is required,
            e.g. 2026-07-04T09:00:00+00:00 or 2026-07-04T11:00:00+02:00.
    PatchedUpdateMultiUnit:
      type: object
      description: |-
        Partially update a parent/child multi-unit.

        Every field is optional, but ``main_unit`` and ``rentals`` must be supplied
        together (or both omitted). When they are supplied, the multi-unit's office
        and address are refreshed from the new main unit; newly added properties have
        their calendars blocked and removed ones unblocked for future reservations
        (see ``save_rentals_and_block``).
      properties:
        name:
          type: string
          description: New name for the multi-unit.
        main_unit:
          type: string
          title: Contract number
          description: Id of the property (rental) to set as the main (parent) unit.
            Must be provided together with rentals; the multi-unit's office and address
            are refreshed from it.
        rentals:
          type: array
          items:
            type: string
            title: Contract number
          description: Ids of the properties (rentals) to group under the multi-unit,
            including the main unit and at least one sub-unit. Must be provided together
            with main_unit. A property not already in this multi-unit must not belong
            to another one and must share the main unit's address or sit within the
            configured distance of it. Newly added properties have their future reservations'
            calendars blocked and removed ones unblocked.
