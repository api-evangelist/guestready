        * `ONBOARDING` - ONBOARDING
    MultiUnitTypeEnum:
      enum:
      - PARENT_CHILD
      - HOTEL
      type: string
      description: |-
        * `PARENT_CHILD` - PARENT_CHILD
        * `HOTEL` - HOTEL
    Neighbourhood:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Name of the neighbourhood.
          maxLength: 100
        description:
          type: string
          description: Free-text description of the neighbourhood.
        city:
          type: string
          readOnly: true
          description: Name of the city the neighbourhood belongs to.
      required:
      - city
      - id
      - name
    NullEnum:
      enum:
      - null
    Office:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Office name
          description: Name of the office, typically the property manager name combined
            with its city.
          maxLength: 100
        is_internal:
          type: boolean
          title: Is internal?
          description: Whether the office is operated internally by the property manager
            rather than by an external partner. Defaults to false.
        vat_rate:
          type: number
          format: double
          description: VAT rate applied to prices excluding tax, as a decimal fraction
            (for example 0.2 for 20%). Defaults to 0.2.
        user:
          type: string
          readOnly: true
      required:
      - id
      - name
      - user
    OnboardingRequest:
