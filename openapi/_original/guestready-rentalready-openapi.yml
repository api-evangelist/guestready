    RentalAccount:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        rental_id:
          type: string
          title: Contract number
          description: |-
            This field is not editable after creation.
             ALWAYS fill it with the correct value
          readOnly: true
        account_email:
          type: string
          readOnly: true
          maxLength: 500
        reservation_platform_name:
          type: string
          readOnly: true
          maxLength: 250
        synchronization_category:
          $ref: '#/components/schemas/SynchronizationCategoryEnum'
        url:
          type: string
          format: uri
          nullable: true
          maxLength: 200
        platform_id:
          type: string
          nullable: true
          maxLength: 250
        status:
          $ref: '#/components/schemas/RentalAccountStatusEnum'
      required:
      - account_email
      - rental_id
      - reservation_platform_name
      - uuid
    RentalAccountStatusEnum:
      enum:
      - new
      - listed
      - unlisted
      - suspended
      - deleted
      - missing_data
      - failed_to_onboard
      type: string
      description: |-
        * `new` - New
        * `listed` - Listed
        * `unlisted` - Unlisted
        * `suspended` - Suspended
        * `deleted` - Deleted
        * `missing_data` - Missing data
        * `failed_to_onboard` - Failed to onboard
    RentalAgreementSignature:
      type: object
      description: |-
        Scopes the writable ``reservation`` field to the caller's rentals.

        Requires ``user_rentals`` in the serializer context. An unowned or
        non-existent reservation pk then fails ``reservation`` field validation
        identically (before any auto-generated ``UniqueValidator`` runs), so the
        existence of other tenants' reservations -- and whether they already have
        a related record -- cannot be enumerated from the response.
      properties:
        id:
          type: integer
          readOnly: true
        reservation:
          type: integer
        pdf_file:
          type: string
          format: uri
        url:
          type: string
          nullable: true
          readOnly: true
        guest_name:
          type: string
          default: ''
          maxLength: 255
        guest_email:
          type: string
          default: ''
          maxLength: 255
        guest_phone:
          type: string
          maxLength: 50
        language:
          type: string
