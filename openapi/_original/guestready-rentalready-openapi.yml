    CityRule:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Name of rule
          description: Name of the tax rule.
          maxLength: 250
        city:
          type: integer
          description: Id of the city this tax rule applies to.
        charge_type:
          allOf:
          - $ref: '#/components/schemas/ChargeTypeEnum'
          description: |-
            Basis the tax is charged on per night: per adult, per bedroom, or a single flat charge per night.

            * `PER_ADULT` - Per adult / per night
            * `PER_ROOM` - Per room / per night
            * `PER_NIGHT` - Per night
        charge_with:
          allOf:
          - $ref: '#/components/schemas/ChargeWithEnum'
          description: |-
            How the amount is interpreted: FIXED means a fixed money amount, PERCENTAGE means a share of the reservation price.

            * `FIXED` - Fixed
            * `PERCENTAGE` - Percentage
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,4})?$
          description: Tax amount. When charge_with is FIXED, a fixed money amount
            (in the rule's currency) charged per unit per night; when charge_with
            is PERCENTAGE, a fraction of the reservation price between 0 and 1 (e.g.
            0.05 for 5%).
        taxable_base:
          nullable: true
          title: Calculate percentage on
          description: |-
            For percentage rules, the amount the percentage is applied to: RENTAL_INCOME for the rental income only, or ACCOMMODATION for the rental income plus the cleaning fee.

            * `RENTAL_INCOME` - Rental income only
            * `ACCOMMODATION` - Rental income + cleaning fee
          oneOf:
          - $ref: '#/components/schemas/TaxableBaseEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        currency:
          readOnly: true
          nullable: true
          description: |-
            Currency the fixed amount and cap are expressed in, taken from the property manager's branch. Null when no branch currency is set.

            * `AED` - AED
            * `AUD` - AUD
            * `BRL` - BRL
            * `CAD` - CAD
            * `CHF` - CHF
            * `CZK` - CZK
            * `EUR` - EUR
            * `GBP` - GBP
            * `HKD` - HKD
            * `IDR` - IDR
            * `ILS` - ILS
            * `JPY` - JPY
            * `KRW` - KRW
            * `MAD` - MAD
            * `MYR` - MYR
            * `PLN` - PLN
            * `RUB` - RUB
            * `SAR` - SAR
            * `THB` - THB
            * `USD` - USD
          oneOf:
          - $ref: '#/components/schemas/CurrencyD53Enum'
          - $ref: '#/components/schemas/NullEnum'
        max_cap:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
          nullable: true
          title: Maximum cap per night
          description: Upper limit on the tax, per charge unit per night, in the rule's
            currency; applies to percentage rules only. Null means no cap.
        max_number_of_nights:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
          title: Maximum number of nights
          description: Maximum number of nights the tax is charged for in a single
            stay; longer stays are charged as if they lasted this many nights. Null
            means every night is charged.
        affected_months:
          type: array
          items:
            type: integer
          readOnly: true
          description: Months, as numbers 1-12, during which the rule applies; the
            rule is used when the stay's month falls in this set.
        from_date:
          type: string
          format: date
          nullable: true
          description: Start date for when this rule applies
        until_date:
          type: string
          format: date
          nullable: true
          description: End date for when this rule applies
        is_default:
          type: boolean
          title: Set as default
          description: If enabled, it will be assigned automatically to new properties
            of the City
      required:
      - affected_months
      - amount
      - charge_type
      - charge_with
      - city
      - currency
      - id
      - name
