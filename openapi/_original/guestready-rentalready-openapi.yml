        external_comment:
          type: string
          nullable: true
          readOnly: true
          description: External-facing comment for the mission. Writable on create
            and PATCH; stored on the mission's reservation (in the type-scoped column)
            when the mission has one and is not of type EXTRA. Writing it on PATCH
            requires the can_api_update_mission_external_comment permission.
        edit_comment:
