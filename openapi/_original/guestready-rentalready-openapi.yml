  /api/v3/messages/:
    get:
      operationId: messages_list
      description: Retrieve a list of messages accessible to the current user.
      summary: List messages
      parameters:
      - in: query
        name: channel
        schema:
          type: string
          nullable: true
          enum:
          - airbnb
          - booking
          - booking-com
          - booking-qa
          - email
          - guestspace
          - homeaway
          - internal
          - sms
          - support
          - vrbo
          - vrbo_qa
          - whatsapp
        description: |-
          * `airbnb` - Airbnb
          * `homeaway` - HomeAway
          * `vrbo` - VRBO
          * `vrbo_qa` - VRBO (QA)
          * `email` - Email
          * `sms` - SMS
          * `booking` - Booking.com (Channel-Manager)
          * `booking-com` - Booking.com
          * `booking-qa` - Booking.com QA
          * `internal` - Internal
          * `whatsapp` - WhatsApp
          * `guestspace` - Guest space
          * `support` - Support
      - in: query
        name: conversation_id
        schema:
          type: integer
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: sender
        schema:
          type: string
      - in: query
        name: sent_after
        schema:
          type: string
          format: date-time
      - in: query
        name: sent_before
        schema:
          type: string
          format: date-time
      tags:
      - Messages
      security:
      - oauth2:
        - messages:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMessageList'
          description: ''
    post:
      operationId: messages_create
      description: |-
        Create a new message in a conversation.

        **Accepted `channel` values:**

        - `internal` (default): Internal note, not visible to the guest.
        - `guestspace`: Sent via the guest portal.
        - `airbnb`: Sent via the Airbnb messaging thread. Requires a channel manager link. Note: Airbnb enforces a 72-hour reply window.
        - `booking-com`: Sent via the Booking.com messaging thread. Requires a channel manager link. Note: no HTML, limited length.
        - `homeaway`: Sent via the HomeAway messaging thread. Requires a channel manager link.
        - `vrbo`: Sent via the VRBO messaging thread. Requires a channel manager link.
        - `email`: Sent via email to the guest.
        - `sms`: Sent by SMS. Requires the guest to have a phone number, and the caller to hold the `can_send_twilio_sms` permission (`403` otherwise).
        - `whatsapp`: Sent via WhatsApp. Requires a WhatsApp number on the property manager and an open Meta customer-service window, i.e. the guest sent a WhatsApp message within the last 24 hours.

        A `400` error is returned when an OTA channel (`airbnb`, `booking-com`, `homeaway`, `vrbo`) is requested but the conversation has no active channel manager connection, and when `sms` or `whatsapp` is requested but the conversation cannot reach the guest that way. The error lists the channels the conversation can actually use.
      summary: Create message
      tags:
      - Messages
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MessageCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MessageCreate'
        required: true
      security:
      - oauth2:
        - messages:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageCreate'
          description: ''
  /api/v3/messages/{id}/:
    get:
      operationId: messages_retrieve
      description: Retrieve a specific message by ID.
      summary: Retrieve message
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this message.
        required: true
      tags:
      - Messages
      security:
      - oauth2:
        - messages:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
