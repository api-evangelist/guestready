            schema:
              $ref: '#/components/schemas/PatchedArchiveIncident'
      security:
      - oauth2:
        - incidents:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
          description: ''
        '400':
          content:
            application/json:
              schema:
                example:
                  non_field_errors:
                  - An archived incident cannot change status.
          description: ''
        '403':
          content:
            application/json:
              schema:
                example:
                  detail: Permission to manage the incident dashboard is required.
          description: ''
