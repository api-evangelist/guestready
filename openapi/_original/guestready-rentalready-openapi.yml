    PaidToEnum:
      enum:
      - HOST
      - PROPERTY_MANAGER
      type: string
      description: |-
        * `HOST` - Owner
        * `PROPERTY_MANAGER` - Property manager
    PatchedArchiveIncident:
      type: object
      description: |-
        Base write serializer for the incident ``close`` / ``archive`` actions.

        Bound to the incident instance (like
        ``MarkPayoutAdjustmentAsPaidSerializer``): transition rules are checked in
        ``validate`` against ``self.instance`` and the mutation happens in
        ``update``.

        Modelled on the incident dashboard's Close / Archive buttons, but it does
        NOT reproduce ``authentification.views.MarkIncidentAsClosed`` /
        ``MarkIncidentAsIgnored`` line for line. Three deliberate divergences:

        1. **Only a non-empty comment overwrites** ``status_change_comment``. The
           views assign ``request.POST.get("comment", None)`` UNCONDITIONALLY, so a
           no-comment post wipes the existing reason -- including the note
           ``issue_manager.signals.close_incident_when_all_tickets_closed`` writes
           ("All tickets are closed."). An API caller re-closing without a comment
           must not silently destroy that provenance.
        2. **Transitions out of IGNORED are rejected.** The views themselves accept
           any transition; it is the dashboard TEMPLATES that make IGNORED terminal
           (``staffing/templates/staffing/mission_incidents.html`` and
           ``authentification/templates/authentification/table_actions.html`` both
           disable the whole action menu on an archived incident). The API mirrors
           what the interface can actually produce, not what the views would let
           through -- otherwise the API could re-archive an incident, overwriting a
           human's archive note and bumping ``status_updated_at`` in a way no user
           can.
        3. **Idempotent re-close is allowed** even though the template hides Close
           on a CLOSED incident: re-closing changes nothing a caller cares about
           (same target status, ``status_updated_at`` keeps the original transition
           time), and an agent retrying a call it cannot tell succeeded must not
           get a spurious 400. CLOSED -> IGNORED stays allowed too, because the
           templates do offer Archive on a closed incident.
      properties:
        comment:
          type: string
          nullable: true
          description: Optional free-text reason recorded on the incident for this
            status change. Left out, blank, or null, the previous status comment is
            kept -- notably the automatic 'All tickets are closed.' note.
