      description: 'Put a triage flag on a conversation, or remove it. Flags are the
        mailbox''s triage queues; list the ids with the conversation_flags endpoint.
        `flag_id` is required and nullable: null removes the flag, while omitting
        the field is a 400, never a silent no-op. The change is recorded on the conversation''s
        event trail and noted on every ticket raised from the conversation, exactly
        as the mailbox does it.'
      summary: Set conversation flag
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this conversation.
        required: true
      tags:
      - Conversations
