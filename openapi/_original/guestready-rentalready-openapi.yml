      - Disposals / Collections
    Reservation:
      type: object
      description: Renders custom-field values under `custom_fields`, skipped on list
        actions.
      properties:
        number:
          type: string
          description: Guest-facing booking reference generated by the system and
            shared with the guest, distinct from the platform's own reservation id.
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when the reservation record was created in the system
            (ISO 8601, e.g. 2026-07-04T09:00:00Z).
        modified_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when the reservation was last modified (ISO 8601,
            e.g. 2026-07-04T09:00:00Z).
        source:
          type: string
          description: Name of the platform (booking channel) the reservation came
            from, e.g. the connected OTA or a direct booking.
        currency:
          description: |-
            ISO 4217 currency code of the reservation's monetary amounts, e.g. EUR.

            * `AED` - AED
            * `AUD` - AUD
            * `BRL` - BRL
            * `CAD` - CAD
            * `CHF` - CHF
            * `CZK` - CZK
            * `EUR` - EUR
            * `GBP` - GBP
            * `HKD` - HKD
            * `IDR` - IDR
            * `ILS` - ILS
            * `JPY` - JPY
            * `KRW` - KRW
            * `MAD` - MAD
            * `MYR` - MYR
            * `PLN` - PLN
            * `RUB` - RUB
            * `SAR` - SAR
            * `THB` - THB
            * `USD` - USD
          oneOf:
          - $ref: '#/components/schemas/CurrencyD53Enum'
          - $ref: '#/components/schemas/BlankEnum'
        reservation_status:
          allOf:
          - $ref: '#/components/schemas/ReservationStatusEnum'
          readOnly: true
          description: |-
            Reservation lifecycle status. Possible values: `pending` — a tentative/held reservation (e.g. an unconfirmed manual quote hold); `accepted` — a confirmed booking; `cancelled` — a cancelled booking. Note: guest inquiries never appear here. An inquiry is not a reservation — read inquiry state from the inquiries endpoint or a conversation's `inquiry_ids`. A reservation (and therefore this field) only exists once a booking is confirmed or created as an internal tentative hold.

            * `pending` - pending
            * `accepted` - accepted
            * `cancelled` - cancelled
        reservation_type:
          allOf:
          - $ref: '#/components/schemas/ReservationTypeEnum'
          readOnly: true
          description: |-
            Kind of reservation, distinguishing a real guest booking from an owner (blocking) stay or a placeholder booking.

            * `CLASSIQUE` - CLASSIQUE
            * `FAUSSE` - FAUSSE
            * `PROPRIETAIRE` - PROPRIETAIRE
        is_owner:
          type: boolean
          description: True when the reservation is an owner stay that blocks the
            property for the owner's own use rather than a paying guest booking.
        property_manager_commission:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        pms_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        payment_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        guest_preferred_language:
          type: string
          description: Name of the guest's preferred language, e.g. English.
        total_paid_by_guest:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        payment_links_deposits:
          type: array
          items:
            $ref: '#/components/schemas/PaymentLinkSecurityDeposit'
          readOnly: true
          description: This field is deprecated and will be removed in the v4. Use
            the payment_links endpoint instead.
        swikly_deposit:
          allOf:
          - $ref: '#/components/schemas/SwiklyDepositEmbedded'
          readOnly: true
          description: This field is deprecated and will be removed in the v4. Use
            the swikly_deposits endpoint instead.
        keynest_code:
          type: string
          nullable: true
          readOnly: true
          description: KeyNest collection code for the check-in, or null if none.
        keynest_access_link:
          type: string
          nullable: true
          readOnly: true
          description: KeyNest access link for the check-in, or null if none.
        igloohome_code:
          type: string
          nullable: true
          readOnly: true
          description: Igloohome lock code for the check-in, or null if none.
        key_code:
          type: string
        cancellation_date:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the reservation was cancelled (ISO 8601, e.g.
            2026-07-04T09:00:00Z); set once a cancellation takes place.
        guest_reservation_id:
          type: string
          description: Guest-facing booking reference; the same value as `number`.
        platform_reservation_id:
          type: string
          description: Identifier of the reservation on the external booking platform,
            as assigned by that platform.
        cleaning_internal_comment:
          type: string
          description: Cleaning note for the reservation, visible to staff only.
        cleaning_external_comment:
          type: string
          description: Cleaning note for the reservation, visible to staff and the
            assigned agent.
        check_in_internal_comment:
          type: string
          description: Check-in note for the reservation, visible to staff only.
        check_in_external_comment:
          type: string
          description: Check-in note for the reservation, visible to staff and the
            assigned agent.
        check_out_internal_comment:
          type: string
          description: Check-out note for the reservation, visible to staff only.
        check_out_external_comment:
          type: string
          description: Check-out note for the reservation, visible to staff and the
            assigned agent.
        is_stay_extension:
          type: boolean
          nullable: true
          title: Is this a stay extension?
          description: Flag marking the reservation as an extension of an earlier
            stay.
        relocated_from_id:
          type: integer
          description: Id of the reservation this one was relocated from, when the
            stay was moved over from another property.
        voucher_redemption:
          type: array
          items:
            $ref: '#/components/schemas/VoucherRedemption'
          readOnly: true
        branch_name:
          type: string
          description: Name of the branch the reservation's office belongs to.
        office_name:
          type: string
          description: Name of the office managing the reservation's property.
        owner_net_earnings:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        guest_total_to_pay:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
          readOnly: true
          title: Total to pay
          description: Total amount to be paid by the guest.
        extra_fees:
          type: array
          items:
            $ref: '#/components/schemas/ReservationExtraFee'
        id_verification_status:
          allOf:
          - $ref: '#/components/schemas/IdVerificationStatusEnum'
          readOnly: true
          description: |-
            Status of the guest's identity verification: not verified, pending, verified, or failed.

            * `NOT_VERIFIED` - NOT_VERIFIED
            * `PENDING` - PENDING
            * `VERIFIED` - VERIFIED
            * `FAILED` - FAILED
        reviewed_by:
          type: string
          readOnly: true
          description: Username of the staff member who reviewed the guest's identity
            document.
        rate_plan_name:
          type: string
          nullable: true
          description: Name of the rate plan applied to the reservation; rate_plan_display_name
            gives its human-friendly label.
          maxLength: 255
        rate_plan_display_name:
          type: string
          readOnly: true
          description: Human-friendly display name of the rate plan applied to the
            reservation.
        mid_term_period_breakdown:
          type: array
          items:
            $ref: '#/components/schemas/MidTermPeriodBreakdown'
          nullable: true
          readOnly: true
          description: Per-period rent breakdown for a mid-term stay, or null when
            the reservation is not mid-term.
        id:
          type: integer
          readOnly: true
          description: Id of the reservation (booking) in the system.
        rental_id:
          type: string
          description: Id of the property (rental) the reservation is for.
        booked_at:
          type: string
          readOnly: true
          description: Timestamp when the booking was originally placed on the source
            platform (ISO 8601, e.g. 2026-07-04T09:00:00Z); falls back to when the
            reservation was first created in the system.
        reservation_platform_id:
          type: integer
          description: Id of the reservation platform (the booking channel) the reservation
            belongs to.
        checkin_date:
          type: string
          format: date
          description: Check-in date, the first night of the stay (YYYY-MM-DD).
        checkout_date:
          type: string
          format: date
          description: Check-out date, the day the guest leaves (YYYY-MM-DD); falls
            after the check-in date.
        rental_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        platform_cleaning_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        invoiced_cleaning_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        platform_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        guest_first_name:
          type: string
          description: Guest's first name.
          maxLength: 90
        guest_last_name:
          type: string
          description: Guest's last name.
          maxLength: 150
        guest_email:
          type: string
          format: email
          nullable: true
          maxLength: 254
        guest_phone_number:
          type: string
        guest_personal_email:
          type: string
        arrival_time:
          type: string
          format: time
          description: Expected guest arrival time on the check-in date (e.g. 15:00:00).
        departure_time:
          type: string
          format: time
          description: Expected guest departure time on the check-out date (e.g. 11:00:00).
        number_of_adults:
          type: integer
          description: Number of adults staying on the reservation.
        number_of_children:
          type: integer
          description: Number of children staying on the reservation.
        number_of_infants:
          type: integer
          description: Number of infants staying on the reservation (at most 5).
        number_of_pets:
          type: integer
          description: Number of pets on the reservation.
        city_tax:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        status:
          allOf:
          - $ref: '#/components/schemas/Status3eaEnum'
          description: |-
            Internal reservation status. The simplified pending/accepted/cancelled view is exposed separately as reservation_status.

            * `TENTATIVE` - Tentative
            * `NEW` - New
            * `ARCHIVED` - Archived
            * `CANCELLED` - Cancelled
            * `CANCELLED_FEE` - Cancelled with fee
        is_stay_relocation:
          type: boolean
          nullable: true
          title: Is this a stay relocation?
          description: Flag tagging the reservation as a stay relocation, for callers
            that mark relocations through the API while keeping the reservation on
            its current property.
        blocked_reason:
          nullable: true
          description: |-
            Reason the dates are blocked on an owner (blocking) reservation, such as an owner stay or maintenance.

            * `HOST_STAY` - Owner stay
            * `MAINTENANCE` - Maintenance
            * `OTHER` - Other
            * `PARTIAL_OCCUPANCY` - Partially occupied
            * `FULL_OCCUPANCY` - Fully occupied
            * `BLOCKED_BY_HOST` - Blocked by owner
            * `UPSELLING_REQUEST` - Upselling request
          oneOf:
          - $ref: '#/components/schemas/BlockedReasonEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        blocked_notes:
          type: string
          nullable: true
          description: Free-text notes explaining a calendar block.
        internal_comment:
          type: string
          description: Free-text internal note about the reservation, visible to staff
            only.
        return_cleaning:
          nullable: true
          title: Owner return cleaning
          description: |-
            Cleaning arrangement for the owner's return on an owner (blocking) reservation, setting who provides the bedding.

            * `FULL_OWNER` - Full cleaning + Owner bedding
            * `FULL_PROPERTY_MANAGER` - Full cleaning + Property manager bedding
          oneOf:
          - $ref: '#/components/schemas/ReturnCleaningEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        departure_cleaning:
          nullable: true
          title: Owner departure cleaning
          description: |-
            Cleaning arrangement for the owner's departure on an owner (blocking) reservation, setting the cleaning level and who provides the bedding.

            * `FULL_OWNER` - Full cleaning + Owner bedding
            * `FULL_PROPERTY_MANAGER` - Full cleaning + Property manager bedding
            * `DELIVERY` - Delivery (No cleaning + Property manager bedding)
            * `CLEANING_ONLY` - Cleaning only (Full cleaning + Owner bedding)
            * `NO_CLEANING` - No cleaning
          oneOf:
          - $ref: '#/components/schemas/DepartureCleaningEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        platform_payment_fees:
          type: string
          readOnly: true
        passport_number:
          type: string
          nullable: true
          maxLength: 50
        guest_invoice:
          $ref: '#/components/schemas/GuestInvoice'
        guidebook_url:
          type: string
          format: uri
          nullable: true
          maxLength: 200
        user:
          type: string
          readOnly: true
      required:
      - booked_at
      - branch_name
      - checkin_date
      - checkout_date
      - city_tax
      - created_at
      - extra_fees
      - guest_personal_email
      - guest_phone_number
      - guest_preferred_language
      - guest_reservation_id
      - guest_total_to_pay
      - id
      - id_verification_status
      - igloohome_code
      - invoiced_cleaning_fee
      - is_owner
      - key_code
      - keynest_access_link
      - keynest_code
      - mid_term_period_breakdown
      - modified_at
      - number
      - number_of_adults
      - number_of_children
      - office_name
      - owner_net_earnings
      - payment_fee
      - payment_links_deposits
      - platform_cleaning_fee
      - platform_fee
      - platform_payment_fees
      - platform_reservation_id
      - pms_fee
      - property_manager_commission
      - rate_plan_display_name
      - rental_amount
      - rental_id
      - reservation_platform_id
      - reservation_status
      - reservation_type
      - reviewed_by
      - source
      - swikly_deposit
      - total_paid_by_guest
      - user
      - voucher_redemption
