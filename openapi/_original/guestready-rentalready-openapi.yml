          type: string
          title: Phone number
          pattern: ^\+\d{8,15}$
          maxLength: 160
        property_manager:
          type: string
        default_locale:
          allOf:
          - $ref: '#/components/schemas/OwnerDefaultLocaleEnum'
          title: Default language
        type:
          $ref: '#/components/schemas/TypeF08Enum'
        gender:
          $ref: '#/components/schemas/GenderEnum'
        nationality:
          default: ''
          oneOf:
          - $ref: '#/components/schemas/BankCountryEnum'
          - $ref: '#/components/schemas/BlankEnum'
        date_of_birth:
          type: string
          format: date
          nullable: true
        job:
          type: string
          nullable: true
          title: Occupation
          maxLength: 30
        managed_by:
          type: integer
          nullable: true
        address_line1:
          type: string
          title: Address line  1
        address_line2:
          type: string
          nullable: true
          title: Address line  2
        post_code:
          type: string
          nullable: true
          title: Postcode
          maxLength: 10
        city:
          type: string
          nullable: true
          maxLength: 100
        region:
          type: string
          nullable: true
          maxLength: 40
        country_of_residence:
          default: ''
          oneOf:
          - $ref: '#/components/schemas/BankCountryEnum'
          - $ref: '#/components/schemas/BlankEnum'
        bank_account_iban:
          type: string
          title: Bank account (IBAN)
          maxLength: 500
        bic:
          type: string
          nullable: true
          pattern: ^[a-zA-Z]{6}[a-zA-Z0-9]{2}([a-zA-Z0-9]{3})?$
          maxLength: 50
        bank_account_number:
          type: string
          maxLength: 100
        bank_account_routing_number:
          type: string
          title: Bank account sort code / routing number
          maxLength: 100
        bank_account_currency:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/BankAccountCurrencyEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        bank_account_name:
          type: string
          nullable: true
          title: Bank account holder name
          maxLength: 100
        bank_account_holder_address:
          type: string
          nullable: true
          maxLength: 250
        bank_name:
          type: string
          nullable: true
          maxLength: 100
        bank_branch_name:
          type: string
          nullable: true
          maxLength: 100
        bank_country:
          default: ''
          oneOf:
          - $ref: '#/components/schemas/BankCountryEnum'
          - $ref: '#/components/schemas/BlankEnum'
        business_name:
          type: string
          nullable: true
          maxLength: 250
        company_id:
          type: string
          nullable: true
          title: VAT number
          maxLength: 50
        company_number:
          type: string
          nullable: true
          title: Company number / SIREN number
          maxLength: 50
        company_address:
          type: string
          nullable: true
          maxLength: 250
        tax_identification_number:
          type: string
          nullable: true
          title: Tax identification number (TIN)
          maxLength: 250
        host_created_notification:
          type: boolean
          title: Owner creation notification
          description: When the owner account is created, this will send the owner
            a notification containing their login credentials
        property_validation:
          type: boolean
          title: Property validation notification
          description: Once a property is validated, this will automatically send
            the owner a validation notification for the property and a link to their
            Airbnb listing.
        deactivation_property_email:
          type: boolean
          title: Property deactivation notification
          description: Once a property is deactivated, this will automatically send
            the owner a notification of deactivation. It will say to contact the property
            manager to reopen dates / reactivate the property in the future.
        open_dates_notification:
          type: boolean
          description: Periodically send a notification to the owner if not enough
            dates are open
      required:
      - default_locale
      - email
      - name
      - phone
      - user_name
