          maxLength: 50
      required:
      - id
      - name
    BlankEnum:
      enum:
      - ''
    BlockCalendar:
      type: object
      properties:
        rental_id:
          type: string
          description: Id of the property (rental) whose calendar the date range applies
            to.
        start_date:
          type: string
          format: date-time
          description: Start of the date range (ISO 8601, e.g. 2026-07-01T14:00:00).
            The range is interpreted by calendar date, and this date must fall strictly
            before the end date, so the range spans at least one night.
        end_date:
          type: string
          format: date-time
          description: End of the date range (ISO 8601, e.g. 2026-07-05T11:00:00).
            Its calendar date must fall strictly after the start date.
        blocked_reason:
          description: |-
            Reason the calendar range is being blocked.

            * `HOST_STAY` - Owner stay
            * `MAINTENANCE` - Maintenance
            * `OTHER` - Other
            * `PARTIAL_OCCUPANCY` - Partially occupied
            * `FULL_OCCUPANCY` - Fully occupied
            * `BLOCKED_BY_HOST` - Blocked by owner
            * `UPSELLING_REQUEST` - Upselling request
          oneOf:
          - $ref: '#/components/schemas/BlockedReasonEnum'
          - $ref: '#/components/schemas/BlankEnum'
        blocked_notes:
          type: string
          description: Free-text notes about the block.
        return_cleaning:
          description: |-
            Cleaning arrangement for the owner's return, setting who provides the bedding (owner or property manager). Defaults to a full cleaning with property-manager bedding when omitted.

            * `FULL_OWNER` - Full cleaning + Owner bedding
            * `FULL_PROPERTY_MANAGER` - Full cleaning + Property manager bedding
          oneOf:
          - $ref: '#/components/schemas/ReturnCleaningEnum'
          - $ref: '#/components/schemas/BlankEnum'
        departure_cleaning:
          description: |-
            Cleaning arrangement for the owner's departure, setting the cleaning level and who provides the bedding. Defaults to a full cleaning with property-manager bedding when omitted.

            * `FULL_OWNER` - Full cleaning + Owner bedding
            * `FULL_PROPERTY_MANAGER` - Full cleaning + Property manager bedding
            * `DELIVERY` - Delivery (No cleaning + Property manager bedding)
            * `CLEANING_ONLY` - Cleaning only (Full cleaning + Owner bedding)
            * `NO_CLEANING` - No cleaning
          oneOf:
          - $ref: '#/components/schemas/DepartureCleaningEnum'
          - $ref: '#/components/schemas/BlankEnum'
      required:
      - end_date
      - rental_id
      - start_date
    BlockRentalCalendar:
      type: object
      properties:
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        blocked_reason:
          type: string
        blocked_notes:
          type: string
      required:
      - end_date
      - start_date
    BlockedReasonEnum:
      enum:
      - HOST_STAY
      - MAINTENANCE
      - OTHER
      - PARTIAL_OCCUPANCY
      - FULL_OCCUPANCY
      - BLOCKED_BY_HOST
      - UPSELLING_REQUEST
      type: string
      description: |-
        * `HOST_STAY` - Owner stay
        * `MAINTENANCE` - Maintenance
        * `OTHER` - Other
        * `PARTIAL_OCCUPANCY` - Partially occupied
        * `FULL_OCCUPANCY` - Fully occupied
        * `BLOCKED_BY_HOST` - Blocked by owner
        * `UPSELLING_REQUEST` - Upselling request
