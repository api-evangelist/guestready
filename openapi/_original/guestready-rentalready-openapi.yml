      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        property_manager:
          type: string
          readOnly: true
      required:
      - id
      - property_manager
      - username
    Voucher:
      type: object
      properties:
        code:
          type: string
        description:
          type: string
          description: For internal reference
        value:
          oneOf:
          - type: object
            properties:
              kind:
                type: string
                enum:
                - PERCENTAGE
              percentage:
                type: number
          - type: object
            properties:
              kind:
                type: string
                enum:
                - FIXED
              amount:
                type: string
              currency:
                type: string
          readOnly: true
        rentals:
          type: array
          items:
            type: integer
          readOnly: true
          description: Ids of the properties (rentals) the voucher applies to.
        antennes:
          type: array
          items:
            type: integer
          readOnly: true
          description: Ids of the offices the voucher applies to.
        status:
          type: object
          properties:
            code:
              type: string
              enum:
              - DISABLED
              - PAST
              - CURRENT
            label:
              type: string
          readOnly: true
        created:
          type: string
          readOnly: true
          description: Timestamp when the voucher was created (ISO 8601).
        validity_start:
          type: string
          readOnly: true
          description: Date from which the voucher is valid (ISO 8601).
        validity_end:
          type: string
          readOnly: true
          description: Last date on which the voucher is valid (ISO 8601).
        created_by:
          type: string
          nullable: true
          readOnly: true
          description: Username of the user who created the voucher, or null.
        percentage:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
          title: Discount percentage
        enabled:
          type: boolean
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          title: Voucher type
        id:
          type: integer
          readOnly: true
      required:
      - antennes
      - code
      - created
      - created_by
      - description
      - id
      - kind
      - rentals
      - status
      - validity_end
      - validity_start
      - value
    VoucherRedemption:
      type: object
      properties:
        code:
          type: string
        voucher_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - code
      - voucher_amount
