    Incident:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When the incident was reported.
        category:
          allOf:
          - $ref: '#/components/schemas/IncidentCategoryEnum'
          description: |-
            The kind of mission the incident was reported on (cleaning, maintenance, check-in, or quality).

            * `CLEANING` - Cleaning
            * `MAINTENANCE` - Maintenance
            * `CHECK_IN` - Check-in
            * `QUALITY` - Quality
        status:
          allOf:
          - $ref: '#/components/schemas/IncidentStatusEnum'
          description: |-
            Lifecycle status of the incident (new, ticket created, archived, or closed).

            * `NEW` - New
            * `ISSUE_CREATED` - Ticket
            * `IGNORED` - Archived
            * `CLOSED` - Closed
        mission:
          type: integer
          description: Id of the mission the incident was reported on.
        property:
          type: string
          title: Property
          description: Id of the property (Appartement) the mission for this incident
            belongs to.
          nullable: true
          readOnly: true
        comment:
          type: string
          description: Free-text description of the incident.
        status_change_comment:
          type: string
          nullable: true
          description: Comment recorded the last time the status changed.
        status_updated_at:
          type: string
          format: date-time
          nullable: true
          description: When the status was last changed, if ever.
        closed_by:
          type: integer
          readOnly: true
          description: Id of the user who closed the incident. Null on an incident
            that is not closed AND on one closed automatically (the system closes
            an incident once all the tickets created from it are closed), so a CLOSED
            incident with no closed_by was closed automatically, never by a person.
            Archiving never sets it.
        issues:
          type: array
          items:
            type: integer
          readOnly: true
          description: Ids of the tickets (issues) created from this incident.
      required:
      - category
      - closed_by
      - comment
      - created_at
