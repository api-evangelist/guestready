    UpdateMultiUnit:
      type: object
      description: |-
        Partially update a parent/child multi-unit.

        Every field is optional, but ``main_unit`` and ``rentals`` must be supplied
        together (or both omitted). When they are supplied, the multi-unit's office
        and address are refreshed from the new main unit; newly added properties have
        their calendars blocked and removed ones unblocked for future reservations
        (see ``save_rentals_and_block``).
      properties:
        name:
          type: string
          description: New name for the multi-unit.
        main_unit:
          type: string
          title: Contract number
          description: Id of the property (rental) to set as the main (parent) unit.
            Must be provided together with rentals; the multi-unit's office and address
            are refreshed from it.
        rentals:
          type: array
          items:
            type: string
            title: Contract number
          description: Ids of the properties (rentals) to group under the multi-unit,
            including the main unit and at least one sub-unit. Must be provided together
            with main_unit. A property not already in this multi-unit must not belong
            to another one and must share the main unit's address or sit within the
            configured distance of it. Newly added properties have their future reservations'
            calendars blocked and removed ones unblocked.
    UpdatePhoto:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        rental_id:
          type: string
          title: Contract number
          description: |-
            This field is not editable after creation.
             ALWAYS fill it with the correct value
        category:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/CategoryC86Enum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        kind:
          type: string
          description: "Valid choices: \n- balcony_terrace\n- bathroom\n- beach\n\
            - bedroom\n- building\n- dining area\n- Facade_Entrance\n- floor_plan\n\
            - garden\n- inside\n- kitchen\n- livingroom\n- neighbourhood\n- outside\n\
            - parking\n- patio\n- safety\n- surroundings\n- swimming_pool\n- view"
        kind_verbose:
          type: string
          readOnly: true
        position:
          type: integer
          maximum: 2147483647
          minimum: 1
          nullable: true
        subroom_id:
          type: integer
          nullable: true
          description: Id of the room of the property this photo shows, e.g. a bedroom
            or a bathroom. Use the /api/v3/subrooms/ endpoint to list the rooms of
            a property. The room must belong to the same property as the photo. Send
            null to unassign the photo from its room. Moving a photo to another property
            clears the room assignment.
        subroom_type:
          type: string
          nullable: true
          readOnly: true
          description: Room type of the assigned room, e.g. "BEDROOM", "BATHROOM".
            Read-only, null when the photo is not assigned to a room.
        subroom_position:
          type: integer
          nullable: true
          readOnly: true
          description: Position of the assigned room within its property. Read-only,
            null when the photo is not assigned to a room.
      required:
      - id
      - kind_verbose
      - rental_id
      - subroom_position
      - subroom_type
