    Conversation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusFa3Enum'
          readOnly: true
        guest_id:
          type: integer
          readOnly: true
          nullable: true
        guest_name:
          type: string
          nullable: true
          readOnly: true
          description: Guest's full name, or null when the conversation has no guest.
        guest_email:
          type: string
          format: email
          readOnly: true
          nullable: true
        rental_ids:
          type: array
          items:
            type: integer
          readOnly: true
          description: Ids of the properties (rentals) linked to this conversation.
        reservation_ids:
          type: array
          items:
            type: integer
          readOnly: true
          description: Ids of the reservations linked to this conversation.
        inquiry_ids:
          type: array
          items:
            type: integer
          readOnly: true
          description: Ids of the inquiries linked to this conversation.
        default_channel:
          type: string
          readOnly: true
          nullable: true
        flag_id:
          type: integer
          readOnly: true
          nullable: true
          description: Id of the triage flag on this conversation, or null when it
            is not flagged. Flags are the mailbox's triage queues; list them with
            the conversation_flags resource to map a colour to an id.
        flag_name:
          type: string
          nullable: true
          description: Name of the triage flag as the caller's property manager renamed
            it, or null when the conversation is not flagged. Match on flag_class_name
            instead for a value that survives renames.
          readOnly: true
        flag_class_name:
          type: string
          readOnly: true
          nullable: true
          description: Colour of the triage flag (for example 'pink', 'green'), or
            null when the conversation is not flagged. Stable across renames, unlike
            flag_name.
        last_message_id:
          type: integer
          readOnly: true
          nullable: true
          description: Id of the most recent message in this conversation, or null
            when it has none. Read it with the messages resource.
        snooze_until:
          type: string
          format: date-time
          readOnly: true
          description: 'UTC timestamp the conversation stays snoozed until. Never
            null: a conversation that was never snoozed carries a past timestamp,
            so ''currently snoozed'' means snooze_until is in the FUTURE, not that
            a value is present. Every inbound guest message resets it to the time
            that message arrived, which un-snoozes the conversation.'
        automatic_ai_enabled:
          type: boolean
          readOnly: true
          nullable: true
          description: 'Whether the AI answers this conversation automatically. Three-state:
            true, false, or null when it was never set (inherit the office default)
            -- null is not the same as false.'
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
          description: UTC timestamp of the last change to the conversation row (the
            default list ordering).
      required:
      - automatic_ai_enabled
      - created
      - default_channel
      - flag_class_name
      - flag_id
      - flag_name
      - guest_email
      - guest_id
      - guest_name
      - id
      - inquiry_ids
      - last_message_id
      - modified
      - rental_ids
      - reservation_ids
      - snooze_until
      - status
