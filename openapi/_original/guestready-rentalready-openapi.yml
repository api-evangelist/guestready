    MidtermContractFile:
      type: object
      description: |-
        Scopes the writable ``reservation`` field to the caller's rentals.

        Requires ``user_rentals`` in the serializer context. An unowned or
        non-existent reservation pk then fails ``reservation`` field validation
        identically (before any auto-generated ``UniqueValidator`` runs), so the
        existence of other tenants' reservations -- and whether they already have
        a related record -- cannot be enumerated from the response.
      properties:
        id:
          type: integer
          readOnly: true
        attachment:
          type: string
          format: uri
        url:
          type: string
          nullable: true
          readOnly: true
        reservation:
          type: integer
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
      required:
      - attachment
      - created
      - id
      - modified
      - reservation
      - url
    Mission:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        start:
          type: string
          format: date-time
          title: Mission start
          description: Mission start date and time (ISO 8601, e.g. 2026-07-04T09:00:00+00:00).
        end:
          type: string
          format: date-time
          title: Mission end
          description: Mission end date and time (ISO 8601, e.g. 2026-07-04T11:00:00+00:00).
        is_unsynchronised:
          type: boolean
          title: Is unsynchronised?
          description: Unsynchronise this mission from all automation
        type:
          type: integer
          description: Id of the mission type, such as cleaning or maintenance. Any
            mission type except check-in can be selected.
        sub_type:
          type: integer
          nullable: true
          description: Id of the mission subtype. Must be a subtype of the selected
            mission type.
        add_notification_on_checklist_submit:
          type: boolean
          description: Whether to show a notification badge on the Checklists tab
            once the mission checklist is submitted, until it is reviewed.
        mission_paid:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
          title: Mission price
          description: 'The mission price. Stored exactly as sent, but four later
            paths recompute it: editing the property''s check-out price, editing its
            check-in price, the nightly host-mission pass, which reprices a cleaning
            mission around an owner stay, and the daily check-in form penalty job,
            which drops an uncompleted check-in mission to 5 and sets its final agent
            earnings, after which a new price no longer changes what the agent is
            paid, and reaches the owner charge only on an unbilled owner-stay mission.'
        charged_to:
          nullable: true
          description: |-
            This will help us to reconcile the payment but this is not an automated flow.

            * `PROPERTY_MANAGER` - Property Manager
            * `OWNER` - Owner
            * `GUEST` - Guest
            * `PROVIDERS` - Providers
          oneOf:
          - $ref: '#/components/schemas/ChargedToEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        payment_status:
          allOf:
          - $ref: '#/components/schemas/PaymentStatusEnum'
          description: |-
            Set to Paid when the agent has been paid. Updated automatically to Paid when a split to agent happens.

            * `NOT_PAID` - Not paid
            * `PAID` - Paid
        appartement:
          type: string
          title: Contract number
          description: Id of the property (rental) the mission is for. On creation,
            exactly one of appartement, reservation, or issue must be set.
        reservation:
          type: integer
          nullable: true
          description: Id of the reservation (booking) the mission is for.
        issue:
          type: integer
          nullable: true
          title: Ticket
          description: Id of the ticket the mission is for.
        summary:
          type: string
          nullable: true
          title: Summary as displayed on owner invoice
          description: Summary of the mission as shown on the owner invoice.
        internal_comment:
          type: string
          nullable: true
          readOnly: true
          description: Staff-only internal comment for the mission. Writable on create
            and PATCH; stored on the mission's reservation (in the type-scoped column)
            when the mission has one and is not of type EXTRA.
        external_comment:
          type: string
          nullable: true
          readOnly: true
          description: External-facing comment for the mission. Writable on create
            and PATCH; stored on the mission's reservation (in the type-scoped column)
            when the mission has one and is not of type EXTRA. Writing it on PATCH
            requires the can_api_update_mission_external_comment permission.
        edit_comment:
          type: string
          nullable: true
          title: Editing comment
          description: Comment explaining the edit made to the mission.
        payout_adjustment:
          $ref: '#/components/schemas/MissionPayoutAdjustment'
        done:
          type: boolean
          title: Mission has been completed
          description: Whether the mission has been completed.
        agent:
          type: integer
          nullable: true
          description: Id of the agent assigned to the mission. The agent must be
            qualified for the mission type and belong to the office of the mission's
            property.
        status:
          allOf:
          - $ref: '#/components/schemas/MissionStatusEnum'
          description: |-
            Lifecycle status of the mission. Defaults to NEW and is set to ASSIGNED automatically when an agent is assigned; PENDING_CH means it is awaiting validation after a change.

            * `NEW` - New
            * `ASSIGNED` - Assigned
            * `PENDING_CH` - Awaiting validation after a change
            * `CANCELLED` - Cancelled
            * `ARCHIVED` - Archived
        active_status:
          allOf:
          - $ref: '#/components/schemas/ActiveStatusEnum'
          readOnly: true
          description: |-
            Progress status of the mission, computed from its checklist execution: PENDING (to do), DOING (in progress), or DONE.

            * `PENDING` - PENDING
            * `DOING` - DOING
            * `DONE` - DONE
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        collection_code:
          allOf:
          - $ref: '#/components/schemas/KeyCollectionCode'
          readOnly: true
        next_reservation_date:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: Arrival date-time (UTC) of the next reservation at the property,
            or null if there is none.
        is_midterm:
          type: boolean
          readOnly: true
          description: Whether the mission relates to a mid-term stay.
        requested_maintenance_job:
          allOf:
          - $ref: '#/components/schemas/RequestedMaintenanceJobEnum'
          nullable: true
          readOnly: true
        reservation_check_out:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: Check-out date-time (UTC) of the mission's reservation, or
            null if the mission has no reservation.
        user:
          type: string
          readOnly: true
      required:
      - active_status
      - collection_code
      - created_at
      - end
      - external_comment
      - id
      - internal_comment
      - is_midterm
      - next_reservation_date
      - requested_maintenance_job
      - reservation_check_out
      - start
      - updated_at
      - user
