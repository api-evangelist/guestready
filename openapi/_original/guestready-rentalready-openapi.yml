    ReservationDocument:
      type: object
      description: |-
        Scopes the writable ``reservation`` field to the caller's rentals.

        Requires ``user_rentals`` in the serializer context. An unowned or
        non-existent reservation pk then fails ``reservation`` field validation
        identically (before any auto-generated ``UniqueValidator`` runs), so the
        existence of other tenants' reservations -- and whether they already have
        a related record -- cannot be enumerated from the response.
      properties:
        id:
          type: integer
          readOnly: true
        attachment:
          type: string
          format: uri
        url:
          type: string
          nullable: true
          readOnly: true
        reservation:
          type: integer
        document_type:
          $ref: '#/components/schemas/DocumentTypeEnum'
        comment:
          type: string
          nullable: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
      required:
      - attachment
      - created
      - document_type
      - id
      - modified
      - reservation
      - url
