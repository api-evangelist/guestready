          - 'null'
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,1})?$
          description: Guests can book the non-refundable rate until the listing's cancellation policy kicks in and if the reservation's check-out date is within 60 days. Note that 1.0 = 0%,  0.9 = 10% and 0.1 = 90% discount. Please use it accordingly.
