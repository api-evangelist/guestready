          description: If the guest want to book a duration lower than the minstay, he will have to pay for a minstay duration.
        weekend_single_night_forbidden:
          type: boolean
          title: Forbid one night minimum stay for the weekend
          description: Forbid one night minimum stay for the weekend
        include_variable_min_stay:
          type: boolean
          title: Allow to set up periods of minstay
          description: Activates the possibility of having different MinStays over a specific period. If the booking is taken in a long time, it is interesting to have a higher MinStay than for last minute bookings. This factor should ideally be coupled with 'Minimum Night Number Factor optimized' for optimal results.
        include_occupancy_rate:
