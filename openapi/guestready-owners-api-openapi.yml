openapi: 3.2.0
info:
  title: RentalReady Owners API
  version: 1.0.0 (api)
  description: 'This API enables you to access and update resources from RentalReady (GuestReady PMS)


    ### Throttling


    Our API supports up to 400 requests per minute

    '
servers:
- url: https://pms.rentalready.io/api/v3/
  description: Base URL declared by the provider in apis.yml (roadmap#122).
tags:
- name: owners
paths:
  /api/v3/owners/:
    get:
      operationId: owners_list
      parameters:
      - in: query
        name: email
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - owners
      security:
      - oauth2:
        - owners:read
      - oauth2:
        - hosts:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOwnerList'
          description: ''
    post:
      operationId: owners_create
      description: Create an owner
      tags:
      - owners
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOwner'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateOwner'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateOwner'
        required: true
      security:
      - oauth2:
        - owners:write
      - oauth2:
        - hosts:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOwner'
          description: ''
  /api/v3/owners/{username}/:
    get:
      operationId: owners_retrieve
      parameters:
      - in: path
        name: username
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - owners
      security:
      - oauth2:
        - owners:read
      - oauth2:
        - hosts:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Owner'
          description: ''
    patch:
      operationId: owners_partial_update
      parameters:
      - in: path
        name: username
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - owners
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOwner'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOwner'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOwner'
      security:
      - oauth2:
        - owners:write
      - oauth2:
        - hosts:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Owner'
          description: ''
    delete:
      operationId: owners_destroy
      parameters:
      - in: path
        name: username
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - owners
      security:
      - oauth2:
        - owners:write
      - oauth2:
        - hosts:write
      responses:
        '204':
          description: No response body
components:
  schemas:
    BlankEnum:
      enum:
      - ''
    CreateOwner:
      type: object
      properties:
        name:
          type: string
          readOnly: true
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        user_name:
          type: string
        phone:
          type: string
        property_manager:
          type: string
        default_locale:
          $ref: '#/components/schemas/CreateOwnerDefaultLocaleEnum'
        type:
          $ref: '#/components/schemas/TypeF08Enum'
        gender:
          $ref: '#/components/schemas/GenderEnum'
        nationality:
          default: ''
          oneOf:
          - $ref: '#/components/schemas/BankCountryEnum'
          - $ref: '#/components/schemas/BlankEnum'
        date_of_birth:
          type:
          - string
          - 'null'
          format: date
        job:
          type:
          - string
          - 'null'
          title: Occupation
          maxLength: 30
        managed_by:
          type:
          - integer
          - 'null'
        address_line1:
          type: string
          title: Address line  1
        address_line2:
          type:
          - string
          - 'null'
          title: Address line  2
        post_code:
          type:
          - string
          - 'null'
          title: Postcode
          maxLength: 10
        city:
          type:
          - string
          - 'null'
          maxLength: 100
        region:
          type:
          - string
          - 'null'
          maxLength: 40
        country_of_residence:
          default: ''
          oneOf:
          - $ref: '#/components/schemas/BankCountryEnum'
          - $ref: '#/components/schemas/BlankEnum'
        bank_account_iban:
          type: string
          title: Bank account (IBAN)
          maxLength: 500
        bic:
          type:
          - string
          - 'null'
          pattern: ^[a-zA-Z]{6}[a-zA-Z0-9]{2}([a-zA-Z0-9]{3})?$
          maxLength: 50
        bank_account_number:
          type: string
          maxLength: 100
        bank_account_routing_number:
          type: string
          title: Bank account sort code / routing number
          maxLength: 100
        bank_account_currency:
          oneOf:
          - $ref: '#/components/schemas/BankAccountCurrencyEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        bank_account_name:
          type:
          - string
          - 'null'
          title: Bank account holder name
          maxLength: 100
        bank_account_holder_address:
          type:
          - string
          - 'null'
          maxLength: 250
        bank_name:
          type:
          - string
          - 'null'
          maxLength: 100
        bank_branch_name:
          type:
          - string
          - 'null'
          maxLength: 100
        bank_country:
          default: ''
          oneOf:
          - $ref: '#/components/schemas/BankCountryEnum'
          - $ref: '#/components/schemas/BlankEnum'
        business_name:
          type:
          - string
          - 'null'
          maxLength: 250
        company_id:
          type:
          - string
          - 'null'
          title: VAT number
          maxLength: 50
        company_number:
          type:
          - string
          - 'null'
          title: Company number / SIREN number
          maxLength: 50
        company_address:
          type:
          - string
          - 'null'
          maxLength: 250
        tax_identification_number:
          type:
          - string
          - 'null'
          title: Tax identification number (TIN)
          maxLength: 250
        host_created_notification:
          type: boolean
          title: Owner creation notification
          description: When the owner account is created, this will send the owner a notification containing their login credentials
        property_validation:
          type: boolean
          title: Property validation notification
          description: Once a property is validated, this will automatically send the owner a validation notification for the property and a link to their Airbnb listing.
        deactivation_property_email:
          type: boolean
          title: Property deactivation notification
          description: Once a property is deactivated, this will automatically send the owner a notification of deactivation. It will say to contact the property manager to reopen dates / reactivate the property in the future.
        open_dates_notification:
          type: boolean
          description: Periodically send a notification to the owner if not enough dates are open
      required:
      - default_locale
      - email
      - first_name
      - last_name
      - name
      - phone
      - property_manager
      - user_name
    TypeF08Enum:
      enum:
      - NATURAL
      - BUSINESS
      - ORGANIZATION
      - SOLETRADER
      type: string
      description: '* `NATURAL` - Individual owner

        * `BUSINESS` - Business entity

        * `ORGANIZATION` - Organization entity

        * `SOLETRADER` - Soletrader entity'
    GenderEnum:
      enum:
      - M
      - F
      type: string
      description: '* `M` - Male

        * `F` - Female'
