openapi: 3.2.0
info:
  title: RentalReady Bedrooms API
  version: 1.0.0 (api)
  description: 'This API enables you to access and update resources from RentalReady (GuestReady PMS)


    ### Throttling


    Our API supports up to 400 requests per minute'
tags:
- name: bedrooms
paths:
  /api/v3/bedrooms/:
    get:
      operationId: bedrooms_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: rental_id
        schema:
          type: string
        description: 'Multiple rental_id parameters are accepted. Example: rental_id=0000&rental_id=0001'
      tags:
      - bedrooms
      security:
      - oauth2:
        - rentals:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBedroomList'
          description: ''
      summary: Bedrooms list
      x-summary-source: derived
    post:
      operationId: bedrooms_create
      parameters:
      - in: query
        name: rental_id
        schema:
          type: string
        description: 'Multiple rental_id parameters are accepted. Example: rental_id=0000&rental_id=0001'
      tags:
      - bedrooms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Bedroom'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Bedroom'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Bedroom'
        required: true
      security:
      - oauth2:
        - rentals:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bedroom'
          description: ''
      summary: Bedrooms create
      x-summary-source: derived
  /api/v3/bedrooms/{id}/:
    get:
      operationId: bedrooms_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this subroom.
        required: true
      - in: query
        name: rental_id
        schema:
          type: string
        description: 'Multiple rental_id parameters are accepted. Example: rental_id=0000&rental_id=0001'
      tags:
      - bedrooms
      security:
      - oauth2:
        - rentals:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bedroom'
          description: ''
      summary: Bedrooms retrieve
      x-summary-source: derived
    put:
      operationId: bedrooms_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this subroom.
        required: true
      - in: query
        name: rental_id
        schema:
          type: string
        description: 'Multiple rental_id parameters are accepted. Example: rental_id=0000&rental_id=0001'
      tags:
      - bedrooms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Bedroom'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Bedroom'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Bedroom'
        required: true
      security:
      - oauth2:
        - rentals:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bedroom'
          description: ''
      summary: Bedrooms update
      x-summary-source: derived
    patch:
      operationId: bedrooms_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this subroom.
        required: true
      - in: query
        name: rental_id
        schema:
          type: string
        description: 'Multiple rental_id parameters are accepted. Example: rental_id=0000&rental_id=0001'
      tags:
      - bedrooms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBedroom'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBedroom'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBedroom'
      security:
      - oauth2:
        - rentals:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bedroom'
          description: ''
      summary: Bedrooms partial update
      x-summary-source: derived
    delete:
      operationId: bedrooms_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this subroom.
        required: true
      - in: query
        name: rental_id
        schema:
          type: string
        description: 'Multiple rental_id parameters are accepted. Example: rental_id=0000&rental_id=0001'
      tags:
      - bedrooms
      security:
      - oauth2:
        - rentals:write
      responses:
        '204':
          description: No response body
      summary: Bedrooms destroy
      x-summary-source: derived
components:
  schemas:
    PatchedBedroom:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        rental_id:
          type: string
          title: Contract number
          description: "This field is not editable after creation.\n ALWAYS fill it with the correct value"
        bedroom_type:
          allOf:
          - $ref: '#/components/schemas/BedroomTypeEnum'
          default: BEDROOM
        window_coverage:
          oneOf:
          - $ref: '#/components/schemas/BedroomWindowCoverageEnum'
          - $ref: '#/components/schemas/NullEnum'
        universal_adapter:
          type: boolean
          readOnly: true
          default: false
        beds:
          type: array
          items:
            $ref: '#/components/schemas/Bed'
    Bed:
      type: object
      properties:
        bed_type:
          type: string
      required:
      - bed_type
    Bedroom:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        rental_id:
          type: string
          title: Contract number
          description: "This field is not editable after creation.\n ALWAYS fill it with the correct value"
        bedroom_type:
          allOf:
          - $ref: '#/components/schemas/BedroomTypeEnum'
          default: BEDROOM
        window_coverage:
          oneOf:
          - $ref: '#/components/schemas/BedroomWindowCoverageEnum'
          - $ref: '#/components/schemas/NullEnum'
        universal_adapter:
          type: boolean
          readOnly: true
          default: false
        beds:
          type: array
          items:
            $ref: '#/components/schemas/Bed'
      required:
      - beds
      - id
      - rental_id
      - universal_adapter
    BedroomWindowCoverageEnum:
      enum:
      - SHUTTER
      - ESHUTTER
      - CURTAIN
      - STORE
      - NOTHING
      type: string
      description: '* `SHUTTER` - SHUTTER

        * `ESHUTTER` - ESHUTTER

        * `CURTAIN` - CURTAIN

        * `STORE` - STORE

        * `NOTHING` - NOTHING'
    PaginatedBedroomList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Bedroom'
        limit:
          type: integer
          example: 50
    BedroomTypeEnum:
      enum:
      - BEDROOM
      - LIVINGROOM
      type: string
      description: '* `BEDROOM` - BEDROOM

        * `LIVINGROOM` - LIVINGROOM'
    NullEnum:
      enum:
      - null
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /o/authorize/
          tokenUrl: /o/token/
          refreshUrl: /o/token/
          scopes:
            read: Read scope
            write: Write scope
            amenities:read: Read amenities
            amenities:write: Create, update and delete amenities
            photos:write: Create, update and delete photos
            reservations:read: Read reservations
            reservations:write: Create, update and cancel reservations
            reservation_platform:read: Read reservation platform
            reviews:read: Read reviews
            reviews:write: Write reviews
            owners:read: Read owners
            owners:write: Write owners
            hosts:read: Read hosts (deprecated)
            hosts:write: Write hosts (deprecated)
            offices:read: Read offices
            property_managers:read: Read property managers
            onboarding_requests:read: Read onboarding requests
            listing_requests:read: Read listing requests
            pricing:read: Read pricing
            pricing:write: Create, update and delete pricing
            users:read: Read user data
            calendar:read: Read calendar
            calendar:write: Write calendar
            rentals:read: Read rentals
            rentals:write: Create, update and delete rentals
            issues:read: Read issues
            issues:write: Write issues
            incidents:read: Read incidents
            incidents:write: Write incidents
            missions:read: Read missions
            missions:write: Write missions
            agents:read: Read agents
            smart_schedulers:read: Read smart schedulers
            smart_schedulers:write: Write smart schedulers
            neighbourhoods:read: Read neighbourhoods
            payment_links:read: Read payment links
            swikly_deposits:read: Read swikly deposits
            payout_adjustments:read: Read payout adjustments
            payout_adjustments:write: Write payout adjustments
            payment_acceptance_transactions:read: Read payment acceptance transactions
            payment_acceptance_transactions:write: Write payment acceptance transactions
            accounting_invoice:read: Read accounting invoices
            accounting_invoice:write: Write accounting invoices
            guest_registration:read: Read guest registration data
            conversations:read: Read conversations
            conversations:write: Write conversations
            messages:read: Read messages
            messages:write: Write messages
            inquiries:read: Read inquiries
            city_tax_rules:read: Read city tax rules
            custom_fields:read: Read custom fields
            custom_fields:write: Write custom fields
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
