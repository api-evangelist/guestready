observations:
- >-
  Enumerations are machine-generated with collision suffixes — CategoryC86Enum, CurrencyD53Enum,
  Status3eaEnum, Status1a4Enum, StatusFa3Enum, TypeF08Enum. The values are real and constrained, but the
  NAMES carry no meaning, so a generated client produces types an agent cannot reason about by name.
- >-
  Every mutable resource has a Patched<Entity> twin (PatchedRental, PatchedReservationCreate, PatchedBedroom)
  — the drf-spectacular PATCH shape. That is 34 schemas of the 296 that are shape duplicates, not new concepts.
- >-
  Currency and locale are modelled per owner (CreateOwnerDefaultLocaleEnum) and per invoice, matching a
  multi-country operation across GBP / EUR / AED / CHF markets.
